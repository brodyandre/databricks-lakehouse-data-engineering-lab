[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-lakehouse-data-engineering-lab"
version = "0.1.0"
description = "End-to-end Databricks Lakehouse data engineering lab using PySpark, Delta Lake, Medallion Architecture, data quality, orchestration and CI/CD."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Luiz André de Souza" }
]
dependencies = [
    "Faker>=37,<41"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"