resources:
  jobs:
    bronze_full_job:
      name: bronze_full_job

      parameters:
        - name: catalog
          default: ${var.catalog}

        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: bronze_full
          notebook_task:
            notebook_path: ../../notebooks/databricks/bronze_full.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "../../dist/*.whl"
              - "Faker>=37,<41"
