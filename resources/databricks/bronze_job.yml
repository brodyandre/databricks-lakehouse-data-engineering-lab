resources:
  jobs:
    bronze_customers_job:
      name: bronze_customers_job

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: bronze_customers

          notebook_task:
            notebook_path: ../../notebooks/databricks/bronze_customers.py

            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
