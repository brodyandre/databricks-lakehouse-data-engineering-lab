name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Tests and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Generate synthetic retail dataset
        run: python data/generator/generate_retail_data.py

      - name: Validate synthetic retail dataset
        run: python data/generator/validate_retail_data.py

      - name: Generate Bronze layer
        run: python data/generator/run_bronze_ingestion.py

      - name: Generate Silver layer
        run: python data/generator/run_silver_processing.py

      - name: Run tests
        run: pytest
